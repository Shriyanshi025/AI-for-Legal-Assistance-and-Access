spring.application.name=legal-assistance-backend

# Local Environment Configuration (optional untracked .env file)
spring.config.import=optional:file:.env[.properties],optional:file:legal-assistance-backend/.env[.properties]


# Application Environment Configuration
app.environment=${APP_ENVIRONMENT:development}

# Datasource Configuration (PostgreSQL / Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:documents}

# Text Chunking Configuration
app.chunking.max-chunk-size=${CHUNKING_MAX_SIZE:1500}
app.chunking.overlap-size=${CHUNKING_OVERLAP_SIZE:200}

# Embedding Configuration (Google Gemini)
app.embedding.provider=${EMBEDDING_PROVIDER:google-gemini}
app.embedding.model=${EMBEDDING_MODEL:gemini-embedding-001}
app.embedding.dimension=${EMBEDDING_DIMENSION:768}
gemini.api.key=${GEMINI_API_KEY:}

# RAG & LLM Generation Configuration (Google Gemini)
app.rag.generation-provider=${GENERATION_PROVIDER:google-gemini}
app.rag.generation-model=${GENERATION_MODEL:gemini-3.5-flash-lite}
app.rag.top-k=${RAG_TOP_K:5}





app.rag.min-similarity=${RAG_MIN_SIMILARITY:0.35}
app.rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:12000}
app.rag.temperature=${RAG_TEMPERATURE:0.0}



